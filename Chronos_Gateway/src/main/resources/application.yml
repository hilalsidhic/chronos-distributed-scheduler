server:
  port: 8080

spring:
  application:
    name: chronos-gateway

  cloud:
    gateway:
      # NEW STRUCTURE for 2025.0.0+ to fix "must not be empty" & warnings
      server:
        webflux:
          routes:
            - id: scheduler
              # Use placeholder: Defaults to localhost, overridden in Docker
              uri: ${SCHEDULER_URI:http://localhost:8081}
              predicates:
                - Path=/scheduler/**
              filters:
                - StripPrefix=1

            - id: worker
              uri: ${WORKER_URI:http://localhost:8083}
              predicates:
                - Path=/worker/**
              filters:
                - StripPrefix=1

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowed-origins: "http://localhost:8085"
                allowed-headers: "*"
                allowed-methods: "*"
                allow-credentials: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"