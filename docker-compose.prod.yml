version: '3.8'

services:
  # ------------------------------------------------------
  # 1. FRONTEND
  # ------------------------------------------------------
  frontend:
    build:
      context: ./chronos-job-dashboard-main
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://159.65.158.1:8080
    container_name: chronos-frontend
    ports:
      - "80:80"
    restart: always
    networks:
      - chronos-net

  # ------------------------------------------------------
  # 2. GATEWAY
  # ------------------------------------------------------
  gateway:
    ports:
      - "8080:8080"
    restart: always
    environment:
      # ⚠️ OVERRIDE DEFAULTS WITH SECRETS
      SPRING_R2DBC_USERNAME: ${PROD_DB_USER}
      SPRING_R2DBC_PASSWORD: ${PROD_DB_PASSWORD}
      FRONTEND_URI: "http://159.65.158.1"
      # You need to re-declare these if the base file uses defaults you want to keep,
      # but generally, Docker merges. However, it's safer to be explicit with URLs
      # if they rely on the DB.
      # SPRING_R2DBC_URL is inherited from base, which is fine (jdbc:postgresql://postgres...)

  # ------------------------------------------------------
  # 3. DATABASE
  # ------------------------------------------------------
  postgres:
    restart: always
    environment:
      # ⚠️ OVERRIDE DEFAULTS WITH SECRETS
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      # POSTGRES_DB and TZ are inherited from base

  # ------------------------------------------------------
  # 4. SCHEDULER
  # ------------------------------------------------------
  scheduler:
    restart: always
    environment:
      # ⚠️ OVERRIDE DEFAULTS WITH SECRETS
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}

  # ------------------------------------------------------
  # 5. WORKER
  # ------------------------------------------------------
  worker:
    restart: always
    environment:
      # ⚠️ OVERRIDE DEFAULTS WITH SECRETS
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}

  # ------------------------------------------------------
  # 6. MONITORING
  # ------------------------------------------------------
  grafana:
    ports:
      - "3000:3000"
    restart: always
    environment:
      # ⚠️ OVERRIDE ADMIN PASSWORD
      - GF_SECURITY_ADMIN_PASSWORD=${PROD_GRAFANA_PASSWORD}

  prometheus:
    restart: always