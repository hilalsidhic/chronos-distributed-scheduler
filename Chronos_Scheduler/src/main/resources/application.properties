spring.application.name=Chronos_Scheduler

# --- SERVER ---
server.port=8081
# Separate port for metrics (Good practice)
management.server.port=8082

# --- DATABASE (The Engine Room) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/chronos_db
spring.datasource.username=chronos
spring.datasource.password=chronos123
spring.datasource.driver-class-name=org.postgresql.Driver

# SAFETY: Preserves data between restarts
spring.jpa.hibernate.ddl-auto=update

# PERFORMANCE: Disable logging for high throughput
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# TIMEZONE: Store in UTC, Display in Local (Best Practice)
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- CONNECTION POOL (The Missing Piece) ---
# Default is 10. We need more to feed 200 threads.
# 20-30 is usually enough because transactions are fast.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# --- OBSERVABILITY (Actuator) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# --- SCHEDULER TUNING (High Load) ---

# BATCHING: 1000 is aggressive but good if your DB is local/fast.
scheduler.max.jobs.process=1000
scheduler.max.jobs.success=500
scheduler.max.jobs.failed=500
scheduler.max.jobs.timedout=500

# QUEUE: Large buffer to handle the 1000-job bursts
scheduler.queue.capacity=2000

# THREAD POOL
# Core 50 / Max 200 matches your 200 HTTP connections downstream.
scheduler.executor.pool_size=50
scheduler.executor.max_pool_size=200
scheduler.executor.queue_capacity=500

# LOGGING
# Only show essential info to save CPU
logging.level.org.springframework=INFO
logging.level.com.chronos=INFO