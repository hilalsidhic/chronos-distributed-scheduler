spring.application.name=Chronos_Worker
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chronos_db
spring.datasource.username=chronos
spring.datasource.password=chronos123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#replace legaccy timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.chronos=DEBUG

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator

# Allow unauthenticated access
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# disable security for actuator
management.endpoints.web.exposure.include=*

spring.security.user.name=disabled
spring.security.user.password=disabled
management.endpoint.metrics.enabled=true
management.server.port=8083

# --- BATCHING (Database Efficiency) ---
# Increased to 100 to reduce DB roundtrips.
worker.max.jobs.process=100
worker.max.executions.stuck=100
worker.max.executions.timedout=100

# --- THREAD POOL (The Muscle) ---
# Core: Keep 50 threads warm and ready.
worker.executor.pool_size=50
# Max: CRITICAL. Matched to http.max.connections (200).
# This ensures every connection slot has a thread to use it.
worker.executor.max_pool_size=200
# Queue: Increased buffer to handle bursts without rejection.
worker.executor.queue_capacity=500
worker.executor.termination_seconds=60

# --- HTTP CLIENT (The Pipe) ---
# Total capacity of the pipe
worker.http.max.connections=200
# CRITICAL: Increased to match Max Total.
# This allows full speed even if all jobs go to the same host (localhost or one API).
worker.http.max.per_route=200

# --- TIMEOUTS (Safety) ---
# valid values (in seconds, assuming your code converts them)
worker.http.timeout.connect=5
worker.http.timeout.request=30
worker.http.timeout.connection_request=5
worker.http.timeout.idle_connections=60

# --- INTERNAL QUEUE ---
# Increased to match the executor queue logic
worker.queue.capacity=500